<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Blueprint Portfolio</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Unique Fonts: Chivo (Headline) and JetBrains Mono (Technical Details) -->
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        headline: ['Chivo', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        // Defined in CSS variables for consistency
                        'base-text': 'var(--base-text)', 
                        'base-bg': 'var(--base-bg)',
                        'accent-primary': 'var(--accent-primary)',
                        'accent-secondary': 'var(--accent-secondary)',
                        'card-border': 'var(--card-border)',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* CSS Variables for Global Consistency */
        :root {
            --base-text: #0B2F56;       /* Deep Navy Blue/Codebase Blue */
            --base-bg: #F8F9FA;         /* Alabaster White */
            --accent-primary: #00A896;  /* Authoritative Teal (Live Site CTA) */
            --accent-secondary: #0B2F56;/* Same as text for consistency */
            --card-border: #D1D5DB;     /* Light Gray Border */
        }

        /* ---------------------------------------------------- */
        /* Custom Background Pattern (Noise/Paper Effect) */
        /* ---------------------------------------------------- */
        body {
            background-color: var(--base-bg);
            color: var(--base-text);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* ---------------------------------------------------- */
        /* Motion: Staggered Fade-In Animation */
        /* ---------------------------------------------------- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-stagger-fade {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0; /* Start hidden */
        }
        
        /* ---------------------------------------------------- */
        /* Typography Styling */
        /* ---------------------------------------------------- */
        .headline {
            font-family: 'Chivo', sans-serif;
        }
        .code-detail {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen p-6 sm:p-12 antialiased">

    <header class="text-center mb-12 sm:mb-20">
        <h1 class="text-5xl sm:text-7xl font-black headline tracking-tight mb-4">
            <span class="text-base-text">erikotn</span>
            <span class="text-accent-primary">.dev</span>
        </h1>
        <p class="text-xl text-base-text/80 max-w-3xl mx-auto code-detail">
            Dynamic Codebase Blueprint — Current public projects.
        </p>
    </header>

    <!-- Repository Container -->
    <div id="repo-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
        <!-- Content will be injected here -->
        <div id="loading-indicator" class="col-span-full text-center py-24 text-2xl text-base-text/60">
            <svg class="animate-spin h-10 w-10 text-accent-primary mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Fetching project manifest...
        </div>
    </div>

    <!-- Custom Modal for Errors (Using the new aesthetic) -->
    <div id="error-modal" class="fixed inset-0 bg-base-text bg-opacity-80 hidden items-center justify-center p-4 z-50">
        <div class="bg-base-bg p-8 rounded-xl shadow-2xl max-w-md w-full border border-red-600 text-base-text">
            <h3 class="text-2xl font-bold text-red-600 mb-4 headline flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h18.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Execution Error [404]
            </h3>
            <p id="error-message" class="text-base-text/90 code-detail text-base mb-6"></p>
            <button onclick="document.getElementById('error-modal').classList.add('hidden', 'opacity-0'); document.getElementById('error-modal').classList.remove('flex', 'opacity-100')" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg headline">
                Acknowledge and Close
            </button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'erikotn';
        const API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=full_name`;
        const REPO_TO_EXCLUDE = 'Overview';

        const repoListElement = document.getElementById('repo-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorModal = document.getElementById('error-modal');
        const errorMessageElement = document.getElementById('error-message');

        /**
         * Shows the custom error modal with a specific message.
         * (Error modal style updated to match new aesthetic)
         */
        function showErrorMessage(message) {
            errorMessageElement.textContent = message;
            errorModal.classList.remove('hidden', 'opacity-0');
            errorModal.classList.add('flex', 'opacity-100');
            loadingIndicator.classList.add('hidden');
        }

        /**
         * Gets the appropriate icon (as an SVG string) based on the primary language.
         * (Icons updated to use the primary accent color)
         */
        function getLanguageIcon(language) {
            // Using Lucide SVG Paths
            const iconMap = {
                'JavaScript': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'TypeScript': '<path d="M17 19h-10a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"/>', // Square
                'Python': '<path d="M20.9 13.5a1.5 1.5 0 0 0-.2-2.7l-4.2-2.1c-.8-.4-1.6-.6-2.5-.6H10a4 4 0 0 0 0 8h.5a1.5 1.5 0 0 0 0-3H10a1 1 0 0 1 0-2h4.5a1.5 1.5 0 0 0 1.4-1.9l-2.1-4.2a1.5 1.5 0 0 0-2.7-.2L6.1 10.8a1.5 1.5 0 0 0-.2 2.7l4.2 2.1c.8.4 1.6.6 2.5.6H14a4 4 0 0 0 0-8h-.5a1.5 1.5 0 0 0 0 3H14a1 1 0 0 1 0 2H9.5a1.5 1.5 0 0 0-1.4 1.9l2.1 4.2a1.5 1.5 0 0 0 2.7.2z"/>', // Zap
                'HTML': '<path d="M12 21.5l-9-2.5V5l9 2.5 9-2.5v14z"/>', // Layout
                'CSS': '<path d="M12 2l10 5.5v11L12 22 2 17.5V6.5zM12 11v6"/>', // Hexagon
                'Shell': '<path d="M13 19l4 4 4-4M3 21h18"/>', // Command
                'Dart': '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-4 17.32l4-4M12 22a10 10 0 0 0 4-17.32l-4 4"/>', // Target
                'C++': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'Java': '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18M15 3v18"/>', // Box Select
            };
            
            const defaultIcon = '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 4.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>'; // Folder icon

            const iconPath = iconMap[language] || defaultIcon;

            // Use the authoritative accent color
            return `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 flex-shrink-0 text-accent-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    ${iconPath}
                </svg>
            `;
        }

        /**
         * Simple color mapping for common languages (Updated for the light theme)
         */
        function getLanguageColor(language) {
            const colors = {
                'JavaScript': '#F7DF1E', // Yellow
                'Python': '#3572A5',
                'HTML': '#E34C26',
                'CSS': '#563D7C',
                'TypeScript': '#2B7489',
                'Shell': '#89E051',
                'Dart': '#00B4AB',
                'Rust': '#DEA584',
                'C++': '#F34B7D',
                'Go': '#00ADD8',
                'Java': '#B07219',
            };
            return colors[language] || '#9CA3AF'; // Default gray
        }

        /**
         * Creates the HTML structure for a single repository card.
         */
        function createRepoCard(repo, index) {
            const language = repo.language || 'N/A';
            const description = repo.description || 'No project description.';
            const lastUpdated = new Date(repo.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            const iconSvg = getLanguageIcon(language);
            const liveUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;

            // Calculate animation delay for the staggered reveal effect
            const animationDelay = (index * 0.08) + 's';

            return `
                <div class="animate-stagger-fade bg-white p-6 rounded-xl border border-card-border shadow-md transition duration-300 flex flex-col hover:shadow-xl hover:border-accent-primary transform hover:scale-[1.01]" style="animation-delay: ${animationDelay};">
                    
                    <div class="flex items-start mb-4 border-b border-card-border pb-4">
                        ${iconSvg}
                        <div class="flex-1 min-w-0">
                            <h2 class="text-2xl font-bold code-detail truncate text-base-text">${repo.name}</h2>
                            <p class="text-xs text-base-text/60 code-detail mt-1">Status: ${repo.private ? 'Private' : 'Public'}</p>
                        </div>
                    </div>

                    <p class="text-base-text/90 text-sm mb-6 flex-grow leading-relaxed">${description}</p>

                    <div class="flex items-center text-xs code-detail text-base-text/70 mb-6 justify-between pt-4">
                        <span class="flex items-center font-medium">
                            <span class="inline-block w-2.5 h-2.5 rounded-full mr-2 flex-shrink-0" style="background-color: ${getLanguageColor(language)};"></span>
                            ${language}
                        </span>
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1 text-yellow-500" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            ${repo.stargazers_count}
                        </span>
                        <span class="text-xs text-base-text/50 hidden sm:inline">Commit: ${lastUpdated}</span>
                    </div>

                    <div class="flex flex-col space-y-3 mt-auto">
                        <!-- Primary Action: Start App (Teal Accent) -->
                        <a href="${liveUrl}" target="_blank" class="block text-center bg-accent-primary text-white font-bold py-3 rounded-lg hover:bg-opacity-90 transition duration-200 shadow-md shadow-accent-primary/50 transform hover:scale-[1.005] active:scale-[0.99] code-detail">
                            Start App
                        </a>
                        
                        <!-- Secondary Action: Source Code (Subtle Text Link) -->
                        <a href="${repo.html_url}" target="_blank" class="block text-center text-base-text/70 font-medium py-1 text-xs hover:text-accent-primary transition duration-200 code-detail">
                            View Source Code on GitHub
                        </a>
                    </div>
                </div>
            `;
        }

        /**
         * Main function to fetch, filter, sort, and display repositories.
         */
        async function fetchRepositories() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    const errorData = await response.json();
                    let message = `[CODE 500] API request failed. Status: ${response.status}. GitHub message: ${errorData.message || 'Unknown error.'}`;
                    showErrorMessage(message);
                    return;
                }

                let repos = await response.json();
                
                // 1. Filter out the specified repository
                repos = repos.filter(repo => repo.name !== REPO_TO_EXCLUDE);

                // 2. Sort alphabetically by repository name
                repos.sort((a, b) => a.name.localeCompare(b.name));

                loadingIndicator.remove(); // Remove loading indicator

                if (repos.length === 0) {
                    repoListElement.innerHTML = `<div class="col-span-full text-center py-24 text-2xl text-base-text/50">Project list empty. No public repositories found.</div>`;
                    return;
                }

                // 3. Generate and insert cards with stagger delay applied
                const repoCardsHtml = repos.map(createRepoCard).join('');
                repoListElement.innerHTML = repoCardsHtml;

            } catch (error) {
                console.error("Network or parsing error:", error);
                showErrorMessage(`[NETWORK ERROR] A fatal error occurred: ${error.message}`);
            }
        }

        // Initialize fetching when the window loads
        window.onload = fetchRepositories;
    </script>
</body>
</html>
