<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic GitHub Portfolio Viewer</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind for custom font and modern color palette -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'app-bg': '#0A0E18',      /* Deep Navy/Dark Blue Background */
                        'card-bg': '#151A2C',     /* Slightly Lighter Card Background */
                        'text-primary': '#E2E8F0', /* Light Text */
                        'text-secondary': '#94A3B8', /* Gray Text */
                        'accent-cyan': '#00E0FF',  /* Vibrant Cyan Accent */
                        'live-site': '#10B981',    /* Emerald Green for Live Site */
                    }
                }
            }
        }
    </script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Custom scrollbar for a modern look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #151A2C;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00E0FF;
        }
    </style>
</head>
<body class="bg-app-bg text-text-primary font-sans min-h-screen p-4 sm:p-8">

    <header class="text-center mb-10 sm:mb-16">
        <h1 class="text-4xl sm:text-6xl font-extrabold text-white mb-2 tracking-tight">
            <span class="text-accent-cyan">erikotn's</span> Projects
        </h1>
        <p class="text-lg text-text-secondary">Explore the latest developments from the GitHub portfolio.</p>
        <a href="https://github.com/erikotn?tab=repositories" target="_blank" class="inline-flex items-center text-sm font-medium text-accent-cyan hover:text-white transition duration-200 mt-4 border-b border-accent-cyan/50 hover:border-white">
            View Source on GitHub Profile
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </a>
    </header>

    <!-- Repository Container -->
    <div id="repo-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
        <!-- Content will be injected here -->
        <div id="loading-indicator" class="col-span-full text-center py-10 text-xl text-text-secondary">
            <svg class="animate-spin h-8 w-8 text-accent-cyan mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Loading your dynamic portfolio...
        </div>
    </div>

    <!-- Custom Modal for Errors -->
    <div id="error-modal" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center p-4 z-50">
        <div class="bg-card-bg p-6 sm:p-8 rounded-xl shadow-2xl max-w-sm w-full border border-red-700">
            <h3 class="text-xl font-bold text-red-400 mb-3 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h18.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                API Error
            </h3>
            <p id="error-message" class="text-text-secondary text-sm mb-4"></p>
            <button onclick="document.getElementById('error-modal').classList.add('hidden')" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                Acknowledge
            </button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'erikotn';
        const API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=full_name`;
        const REPO_TO_EXCLUDE = 'Overview';

        const repoListElement = document.getElementById('repo-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorModal = document.getElementById('error-modal');
        const errorMessageElement = document.getElementById('error-message');

        /**
         * Shows the custom error modal with a specific message.
         * @param {string} message The error message to display.
         */
        function showErrorMessage(message) {
            errorMessageElement.textContent = message;
            errorModal.classList.remove('hidden');
            errorModal.classList.add('flex');
            loadingIndicator.classList.add('hidden');
        }

        /**
         * Gets the appropriate icon (as an SVG string) based on the primary language.
         * Uses Lucide icons (inline SVGs) for a clean, modern look.
         * @param {string} language The programming language name.
         * @returns {string} Complete SVG element string.
         */
        function getLanguageIcon(language) {
            const iconMap = {
                // Lucide SVG Paths (Simplified for common languages)
                'JavaScript': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'TypeScript': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'Python': '<path d="M6 3v18M18 3v18M8 6h8M8 18h8"/>', // Split
                'HTML': '<path d="M10 3l-4 6-4-6h16l-4 6-4-6zM4 18h16M4 21h16"/>', // Compass
                'CSS': '<path d="M12 19.5L18 10L12 4.5L6 10L12 19.5Z"/>', // Hexagon
                'Shell': '<path d="M2 12h20M2 18h20M2 6h20"/>', // Align Justify
                'Dart': '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-4 17.32l4-4M12 22a10 10 0 0 0 4-17.32l-4 4"/>', // Target
                'C++': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'Java': '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18M15 3v18"/>', // Box Select
            };
            
            // Default icon (Folder)
            const defaultIcon = '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 4.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>';

            const iconPath = iconMap[language] || defaultIcon;

            // Use the vibrant accent color for the icon
            return `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 flex-shrink-0 text-accent-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    ${iconPath}
                </svg>
            `;
        }

        /**
         * Simple color mapping for common languages (mimicking GitHub)
         * @param {string} language The programming language name.
         * @returns {string} A hex color string.
         */
        function getLanguageColor(language) {
            const colors = {
                'JavaScript': '#f1e05a',
                'Python': '#3572A5',
                'HTML': '#e34c26',
                'CSS': '#563d7c',
                'TypeScript': '#2b7489',
                'Shell': '#89e051',
                'Dart': '#00B4AB',
                'Rust': '#dea584',
                'C++': '#f34b7d',
                'Go': '#00ADD8',
                'Java': '#b07219',
            };
            return colors[language] || '#94A3B8'; // Default secondary text color
        }

        /**
         * Creates the HTML structure for a single repository card.
         * @param {object} repo Repository data object.
         * @returns {string} The HTML string for the card.
         */
        function createRepoCard(repo) {
            const language = repo.language || 'N/A';
            const description = repo.description || 'No description provided for this project.';
            const lastUpdated = new Date(repo.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            // Dynamic icon based on language
            const iconSvg = getLanguageIcon(language);

            // Constructing the GitHub Pages URL: https://USERNAME.github.io/REPOSITORY_NAME/
            const liveUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;

            return `
                <div class="bg-card-bg p-6 rounded-xl shadow-2xl border border-card-bg hover:border-accent-cyan/50 transition duration-300 flex flex-col transform hover:-translate-y-1">
                    
                    <div class="flex items-start mb-4">
                        ${iconSvg}
                        <div>
                            <h2 class="text-xl font-bold text-white truncate hover:text-accent-cyan transition duration-150">${repo.name}</h2>
                            <p class="text-sm text-text-secondary mt-1">${repo.private ? 'Private' : 'Public'}</p>
                        </div>
                    </div>

                    <p class="text-text-secondary text-sm mb-5 flex-grow">${description}</p>

                    <div class="flex items-center text-xs text-text-secondary mb-5 justify-between">
                        <span class="flex items-center">
                            <span class="inline-block w-3 h-3 rounded-full mr-2 flex-shrink-0" style="background-color: ${getLanguageColor(language)};"></span>
                            ${language}
                        </span>
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 text-yellow-500" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            ${repo.stargazers_count} stars
                        </span>
                        <span class="text-xs text-text-secondary">Updated: ${lastUpdated}</span>
                    </div>

                    <div class="flex space-x-3 mt-auto">
                        <!-- Link to the live website (GitHub Pages URL) -->
                        <a href="${liveUrl}" target="_blank" class="flex-1 block text-center bg-live-site text-white font-bold py-2 rounded-lg hover:bg-opacity-80 transition duration-200 shadow-md transform hover:scale-[1.02] text-sm">
                            Live Website
                        </a>
                        
                        <!-- Link to the source code on GitHub -->
                        <a href="${repo.html_url}" target="_blank" class="flex-1 block text-center bg-card-bg border border-text-secondary/30 text-text-primary font-semibold py-2 rounded-lg hover:bg-card-bg/50 transition duration-200 text-sm">
                            Source Code
                        </a>
                    </div>
                </div>
            `;
        }

        /**
         * Main function to fetch, filter, sort, and display repositories.
         */
        async function fetchRepositories() {
            try {
                // Fetch request
                const response = await fetch(API_URL);

                if (!response.ok) {
                    const errorData = await response.json();
                    let message = `Failed to load repositories. Status: ${response.status}.`;
                    if (errorData.message) {
                        message += ` GitHub message: ${errorData.message}`;
                    }
                    showErrorMessage(message);
                    return;
                }

                let repos = await response.json();
                
                // 1. Filter out the specified repository
                repos = repos.filter(repo => repo.name !== REPO_TO_EXCLUDE);

                // 2. Sort alphabetically by repository name
                repos.sort((a, b) => a.name.localeCompare(b.name));

                loadingIndicator.remove(); // Remove loading indicator

                if (repos.length === 0) {
                    repoListElement.innerHTML = `<div class="col-span-full text-center py-10 text-xl text-text-secondary">No public repositories found (after filtering out '${REPO_TO_EXCLUDE}').</div>`;
                    return;
                }

                // 3. Generate and insert cards
                const repoCardsHtml = repos.map(createRepoCard).join('');
                repoListElement.innerHTML = repoCardsHtml;

            } catch (error) {
                console.error("Network or parsing error:", error);
                showErrorMessage(`A network error occurred while fetching data: ${error.message}`);
            }
        }

        // Initialize fetching when the window loads
        window.onload = fetchRepositories;
    </script>
</body>
</html>
