<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Blueprint Portfolio</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load Unique Fonts: Chivo (Headline) and JetBrains Mono (Technical Details) -->
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        headline: ['Chivo', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        'base-text': 'var(--base-text)',
                        'base-bg': 'var(--base-bg)',
                        'accent-primary': 'var(--accent-primary)',
                        'accent-secondary': 'var(--accent-secondary)',
                        'card-border': 'var(--card-border)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --base-text: #0B2F56;
            --base-bg: #F8F9FA;
            --accent-primary: #00A896;
            --accent-secondary: #0B2F56;
            --card-border: #D1D5DB;
        }

        body {
            background-color: var(--base-bg);
            color: var(--base-text);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-stagger-fade {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .headline { font-family: 'Chivo', sans-serif; }
        .code-detail { font-family: 'JetBrains Mono', monospace; }

        /* Filter-balk */
        .filter-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--card-border);
            background: white;
            color: var(--base-text);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .filter-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        /* Featured-badge */
        .featured-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent-primary);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="min-h-screen p-6 sm:p-12 antialiased">

    <header class="text-center mb-10">
        <h1 class="text-5xl sm:text-7xl font-black headline tracking-tight mb-4">
            <span class="text-base-text">erikotn</span>
            <span class="text-accent-primary">.dev</span>
        </h1>
        <p class="text-xl text-base-text/80 max-w-3xl mx-auto code-detail">
            Dynamic Codebase Blueprint — Current public projects.
        </p>
    </header>

    <!-- Filter bar -->
    <nav id="filter-bar" class="flex flex-wrap justify-center gap-2 mb-12 max-w-5xl mx-auto">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="featured">⭐ Featured</button>
        <button class="filter-btn" data-filter="visual">🎨 Visual</button>
        <button class="filter-btn" data-filter="copy">✍️ Copy</button>
        <button class="filter-btn" data-filter="brand">🏷️ Brand</button>
        <button class="filter-btn" data-filter="audio">🔊 Audio</button>
        <button class="filter-btn" data-filter="tool">🛠️ Tool</button>
    </nav>

    <!-- Repository Container -->
    <div id="repo-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
        <div id="loading-indicator" class="col-span-full text-center py-24 text-2xl text-base-text/60">
            <svg class="animate-spin h-10 w-10 text-accent-primary mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Fetching project manifest...
        </div>
    </div>

    <!-- Empty state per filter -->
    <div id="empty-state" class="hidden text-center py-16 text-lg text-base-text/50 code-detail">
        Geen projecten in deze categorie.
    </div>

    <!-- Custom Modal for Errors -->
    <div id="error-modal" class="fixed inset-0 bg-base-text bg-opacity-80 hidden items-center justify-center p-4 z-50">
        <div class="bg-base-bg p-8 rounded-xl shadow-2xl max-w-md w-full border border-red-600 text-base-text">
            <h3 class="text-2xl font-bold text-red-600 mb-4 headline flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h18.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Execution Error [404]
            </h3>
            <p id="error-message" class="text-base-text/90 code-detail text-base mb-6"></p>
            <button onclick="document.getElementById('error-modal').classList.add('hidden', 'opacity-0'); document.getElementById('error-modal').classList.remove('flex', 'opacity-100')" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg headline">
                Acknowledge and Close
            </button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'erikotn';
        const API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=full_name&per_page=100`;

        // ─── Per-repo config ─────────────────────────────────────────
        // Pas hier aan welke repos featured zijn, in welke categorie ze
        // vallen, of dat ze verborgen moeten worden van de portfolio.
        // Categorieën: visual | copy | brand | audio | tool
        const REPO_CONFIG = {
            // Featured (sortering: bovenaan)
            'BrandSafe':           { category: 'visual', featured: true },
            'merkarchetype-test':  { category: 'brand',  featured: true },
            'imageprompt':         { category: 'copy',   featured: true },
            'my-web-scraper':      { category: 'tool',   featured: true },
            'audiosplitter':       { category: 'audio',  featured: true },
            'batch-squoosh':       { category: 'visual', featured: true },

            // Standaard zichtbaar
            'SocialSafe':          { category: 'visual' },
            'socialcrops':         { category: 'visual' },
            'pmaxframe':           { category: 'visual' },
            'socialframe-v3':      { category: 'visual' },
            'bulksocialcopy':      { category: 'copy' },
            'zonschaduw-nl':       { category: 'tool' },
            'weer-eext':           { category: 'tool' },

            // Verborgen
            'Overview':            { hide: true }, // zelf-referentie
            'socialframe':         { hide: true }, // legacy v1
            'socialframe-v2':      { hide: true }, // legacy v2
            'musicphoto':          { hide: true }, // legacy
            'my-pocket-clone':     { hide: true }, // experiment
            'ad-vault':            { hide: true }, // experiment
        };

        const repoListElement = document.getElementById('repo-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const emptyState = document.getElementById('empty-state');
        const errorModal = document.getElementById('error-modal');
        const errorMessageElement = document.getElementById('error-message');
        const filterBar = document.getElementById('filter-bar');

        let currentFilter = 'all';

        function showErrorMessage(message) {
            errorMessageElement.textContent = message;
            errorModal.classList.remove('hidden', 'opacity-0');
            errorModal.classList.add('flex', 'opacity-100');
            loadingIndicator.classList.add('hidden');
        }

        function getLanguageIcon(language) {
            const iconMap = {
                'JavaScript': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>',
                'TypeScript': '<path d="M17 19h-10a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"/>',
                'Python': '<path d="M20.9 13.5a1.5 1.5 0 0 0-.2-2.7l-4.2-2.1c-.8-.4-1.6-.6-2.5-.6H10a4 4 0 0 0 0 8h.5a1.5 1.5 0 0 0 0-3H10a1 1 0 0 1 0-2h4.5a1.5 1.5 0 0 0 1.4-1.9l-2.1-4.2a1.5 1.5 0 0 0-2.7-.2L6.1 10.8a1.5 1.5 0 0 0-.2 2.7l4.2 2.1c.8.4 1.6.6 2.5.6H14a4 4 0 0 0 0-8h-.5a1.5 1.5 0 0 0 0 3H14a1 1 0 0 1 0 2H9.5a1.5 1.5 0 0 0-1.4 1.9l2.1 4.2a1.5 1.5 0 0 0 2.7.2z"/>',
                'HTML': '<path d="M12 21.5l-9-2.5V5l9 2.5 9-2.5v14z"/>',
                'CSS': '<path d="M12 2l10 5.5v11L12 22 2 17.5V6.5zM12 11v6"/>',
                'Shell': '<path d="M13 19l4 4 4-4M3 21h18"/>',
                'Dart': '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-4 17.32l4-4M12 22a10 10 0 0 0 4-17.32l-4 4"/>',
                'C++': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>',
                'Java': '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18M15 3v18"/>',
            };
            const defaultIcon = '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 4.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>';
            const iconPath = iconMap[language] || defaultIcon;
            return `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 flex-shrink-0 text-accent-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    ${iconPath}
                </svg>
            `;
        }

        function getLanguageColor(language) {
            const colors = {
                'JavaScript': '#F7DF1E', 'Python': '#3572A5', 'HTML': '#E34C26',
                'CSS': '#563D7C', 'TypeScript': '#2B7489', 'Shell': '#89E051',
                'Dart': '#00B4AB', 'Rust': '#DEA584', 'C++': '#F34B7D',
                'Go': '#00ADD8', 'Java': '#B07219',
            };
            return colors[language] || '#9CA3AF';
        }

        // Bepaal de demo-URL: homepage-veld als beschikbaar, anders github.io
        // (alleen als er Pages aan staat). Geen demo → null → geen 'Start App' knop.
        function resolveDemoUrl(repo) {
            if (repo.homepage && repo.homepage.startsWith('http')) {
                return repo.homepage;
            }
            if (repo.has_pages) {
                return `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;
            }
            return null;
        }

        function createRepoCard(repo, index, config) {
            const language = repo.language || 'N/A';
            const description = repo.description || 'No project description.';
            const lastUpdated = new Date(repo.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            const iconSvg = getLanguageIcon(language);
            const demoUrl = resolveDemoUrl(repo);
            const animationDelay = (index * 0.06) + 's';
            const category = config.category || 'tool';
            const featured = !!config.featured;

            const featuredBadge = featured
                ? `<div class="featured-badge">⭐ FEATURED</div>` : '';

            const startAppButton = demoUrl
                ? `<a href="${demoUrl}" target="_blank" class="block text-center bg-accent-primary text-white font-bold py-3 rounded-lg hover:bg-opacity-90 transition duration-200 shadow-md shadow-accent-primary/50 transform hover:scale-[1.005] active:scale-[0.99] code-detail">Start App</a>`
                : `<div class="block text-center bg-gray-200 text-base-text/40 font-bold py-3 rounded-lg code-detail">No live demo</div>`;

            return `
                <div class="repo-card animate-stagger-fade relative bg-white p-6 rounded-xl border border-card-border shadow-md transition duration-300 flex flex-col hover:shadow-xl hover:border-accent-primary transform hover:scale-[1.01]"
                     data-category="${category}"
                     data-featured="${featured}"
                     style="animation-delay: ${animationDelay};">

                    ${featuredBadge}

                    <div class="flex items-start mb-4 border-b border-card-border pb-4">
                        ${iconSvg}
                        <div class="flex-1 min-w-0 pr-16">
                            <h2 class="text-2xl font-bold code-detail truncate text-base-text">${repo.name}</h2>
                            <p class="text-xs text-base-text/60 code-detail mt-1">Category: ${category}</p>
                        </div>
                    </div>

                    <p class="text-base-text/90 text-sm mb-6 flex-grow leading-relaxed">${description}</p>

                    <div class="flex items-center text-xs code-detail text-base-text/70 mb-6 justify-between pt-4">
                        <span class="flex items-center font-medium">
                            <span class="inline-block w-2.5 h-2.5 rounded-full mr-2 flex-shrink-0" style="background-color: ${getLanguageColor(language)};"></span>
                            ${language}
                        </span>
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1 text-yellow-500" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            ${repo.stargazers_count}
                        </span>
                        <span class="text-xs text-base-text/50 hidden sm:inline">${lastUpdated}</span>
                    </div>

                    <div class="flex flex-col space-y-3 mt-auto">
                        ${startAppButton}
                        <a href="${repo.html_url}" target="_blank" class="block text-center text-base-text/70 font-medium py-1 text-xs hover:text-accent-primary transition duration-200 code-detail">
                            View Source Code on GitHub
                        </a>
                    </div>
                </div>
            `;
        }

        function applyFilter(filter) {
            currentFilter = filter;

            // Knoppen in/uit actief
            filterBar.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });

            // Kaarten tonen/verbergen
            const cards = repoListElement.querySelectorAll('.repo-card');
            let visibleCount = 0;
            cards.forEach(card => {
                let show = false;
                if (filter === 'all') show = true;
                else if (filter === 'featured') show = card.dataset.featured === 'true';
                else show = card.dataset.category === filter;

                card.style.display = show ? '' : 'none';
                if (show) visibleCount++;
            });

            // Empty-state
            emptyState.classList.toggle('hidden', visibleCount > 0);
        }

        async function fetchRepositories() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    const errorData = await response.json();
                    showErrorMessage(`[CODE 500] API request failed. Status: ${response.status}. GitHub: ${errorData.message || 'Unknown error.'}`);
                    return;
                }

                let repos = await response.json();

                // 1. Filter: skip hidden + niet in config (default = show)
                repos = repos.filter(repo => {
                    const cfg = REPO_CONFIG[repo.name];
                    return !(cfg && cfg.hide);
                });

                // 2. Sort: featured eerst, dan alfabetisch
                repos.sort((a, b) => {
                    const aFeat = (REPO_CONFIG[a.name] || {}).featured ? 0 : 1;
                    const bFeat = (REPO_CONFIG[b.name] || {}).featured ? 0 : 1;
                    if (aFeat !== bFeat) return aFeat - bFeat;
                    return a.name.localeCompare(b.name);
                });

                loadingIndicator.remove();

                if (repos.length === 0) {
                    repoListElement.innerHTML = `<div class="col-span-full text-center py-24 text-2xl text-base-text/50">Project list empty. No public repositories found.</div>`;
                    return;
                }

                // 3. Render
                const html = repos.map((repo, i) => {
                    const cfg = REPO_CONFIG[repo.name] || { category: 'tool' };
                    return createRepoCard(repo, i, cfg);
                }).join('');
                repoListElement.innerHTML = html;

            } catch (error) {
                console.error("Network or parsing error:", error);
                showErrorMessage(`[NETWORK ERROR] A fatal error occurred: ${error.message}`);
            }
        }

        // Filter-knoppen aansluiten
        filterBar.addEventListener('click', e => {
            if (e.target.classList.contains('filter-btn')) {
                applyFilter(e.target.dataset.filter);
            }
        });

        window.onload = fetchRepositories;
    </script>
</body>
</html>
