<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic GitHub Portfolio Viewer</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind for custom font and modern color palette -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'app-bg': '#070A10',      /* Near-Black Background */
                        'card-bg': '#12151E',     /* Very Dark Card Background */
                        'text-primary': '#F0F3F5', /* Off-White Text */
                        'text-secondary': '#AAB8C2', /* Light Gray Text */
                        'accent-gradient-start': '#8B5CF6', /* Purple */
                        'accent-gradient-end': '#00E0FF',   /* Cyan */
                        'live-site': '#10B981',    /* Emerald Green for Live Site */
                    }
                }
            }
        }
    </script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Custom scrollbar for a modern look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #12151E;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00E0FF;
        }
        /* Custom gradient text class */
        .gradient-text {
            background-image: linear-gradient(90deg, #8B5CF6, #00E0FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        /* Custom glow effect for cards */
        .card-glow:hover {
            box-shadow: 0 10px 30px rgba(0, 224, 255, 0.2), 0 0 10px rgba(139, 92, 246, 0.1);
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-app-bg text-text-primary font-sans min-h-screen p-4 sm:p-8 antialiased">

    <header class="text-center mb-10 sm:mb-16">
        <h1 class="text-4xl sm:text-7xl font-extrabold tracking-tighter mb-4">
            <span class="gradient-text">erikotn's Portfolio</span>
        </h1>
        <p class="text-xl text-text-secondary max-w-2xl mx-auto">
            A dynamic showcase of projects, fetched and sorted automatically from GitHub.
        </p>
    </header>

    <!-- Repository Container -->
    <div id="repo-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
        <!-- Content will be injected here -->
        <div id="loading-indicator" class="col-span-full text-center py-16 text-2xl text-text-secondary">
            <svg class="animate-spin h-10 w-10 text-accent-gradient-end mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Loading your dynamic portfolio...
        </div>
    </div>

    <!-- Custom Modal for Errors -->
    <div id="error-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 z-50">
        <div class="bg-card-bg p-8 rounded-xl shadow-2xl max-w-md w-full border border-red-700">
            <h3 class="text-2xl font-bold text-red-400 mb-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h18.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                API Error Encountered
            </h3>
            <p id="error-message" class="text-text-secondary text-base mb-6"></p>
            <button onclick="document.getElementById('error-modal').classList.add('hidden', 'opacity-0'); document.getElementById('error-modal').classList.remove('flex', 'opacity-100')" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg">
                Close
            </button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'erikotn';
        const API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=full_name`;
        const REPO_TO_EXCLUDE = 'Overview';

        const repoListElement = document.getElementById('repo-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorModal = document.getElementById('error-modal');
        const errorMessageElement = document.getElementById('error-message');

        /**
         * Shows the custom error modal with a specific message.
         * @param {string} message The error message to display.
         */
        function showErrorMessage(message) {
            errorMessageElement.textContent = message;
            errorModal.classList.remove('hidden', 'opacity-0');
            errorModal.classList.add('flex', 'opacity-100');
            loadingIndicator.classList.add('hidden');
        }

        /**
         * Gets the appropriate icon (as an SVG string) based on the primary language.
         * @param {string} language The programming language name.
         * @returns {string} Complete SVG element string.
         */
        function getLanguageIcon(language) {
            // Using Lucide SVG Paths
            const iconMap = {
                'JavaScript': '<path d="M16 8l-6 6 6 6"/>', // Chevron right
                'TypeScript': '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H20a2 2 0 0 1 2 2z"/>', // Folder
                'Python': '<path d="M20.9 13.5a1.5 1.5 0 0 0-.2-2.7l-4.2-2.1c-.8-.4-1.6-.6-2.5-.6H10a4 4 0 0 0 0 8h.5a1.5 1.5 0 0 0 0-3H10a1 1 0 0 1 0-2h4.5a1.5 1.5 0 0 0 1.4-1.9l-2.1-4.2a1.5 1.5 0 0 0-2.7-.2L6.1 10.8a1.5 1.5 0 0 0-.2 2.7l4.2 2.1c.8.4 1.6.6 2.5.6H14a4 4 0 0 0 0-8h-.5a1.5 1.5 0 0 0 0 3H14a1 1 0 0 1 0 2H9.5a1.5 1.5 0 0 0-1.4 1.9l2.1 4.2a1.5 1.5 0 0 0 2.7.2z"/>', // Zap
                'HTML': '<path d="M12 21.5l-9-2.5V5l9 2.5 9-2.5v14z"/>', // Layout
                'CSS': '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM9 10h6M9 14h4"/>', // Tablet
                'Shell': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'Dart': '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-4 17.32l4-4M12 22a10 10 0 0 0 4-17.32l-4 4"/>', // Target
                'C++': '<path d="M12 2v20M5 5l7 7-7 7M19 5l-7 7 7 7"/>', // Code
                'Java': '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18M15 3v18"/>', // Box Select
            };
            
            const defaultIcon = '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 4.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>'; // Folder icon

            const iconPath = iconMap[language] || defaultIcon;

            // Use the gradient start color for the icon
            return `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 flex-shrink-0 text-accent-gradient-start" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    ${iconPath}
                </svg>
            `;
        }

        /**
         * Simple color mapping for common languages (mimicking GitHub)
         * @param {string} language The programming language name.
         * @returns {string} A hex color string.
         */
        function getLanguageColor(language) {
            const colors = {
                'JavaScript': '#F7DF1E', // Yellow
                'Python': '#3572A5',
                'HTML': '#E34C26',
                'CSS': '#563D7C',
                'TypeScript': '#2B7489',
                'Shell': '#89E051',
                'Dart': '#00B4AB',
                'Rust': '#DEA584',
                'C++': '#F34B7D',
                'Go': '#00ADD8',
                'Java': '#B07219',
            };
            return colors[language] || '#AAB8C2'; // Default secondary text color
        }

        /**
         * Creates the HTML structure for a single repository card.
         * @param {object} repo Repository data object.
         * @returns {string} The HTML string for the card.
         */
        function createRepoCard(repo) {
            const language = repo.language || 'N/A';
            const description = repo.description || 'No description provided for this project.';
            const lastUpdated = new Date(repo.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            const iconSvg = getLanguageIcon(language);

            // Constructing the GitHub Pages URL: https://USERNAME.github.io/REPOSITORY_NAME/
            const liveUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;

            return `
                <div class="card-glow bg-card-bg p-6 rounded-xl border border-card-bg transition duration-300 flex flex-col transform hover:translate-y-[-4px] shadow-lg">
                    
                    <div class="flex items-start mb-4">
                        ${iconSvg}
                        <div>
                            <h2 class="text-2xl font-semibold text-text-primary truncate transition duration-150">${repo.name}</h2>
                            <p class="text-sm text-text-secondary mt-1">Status: ${repo.private ? 'Private' : 'Public'}</p>
                        </div>
                    </div>

                    <p class="text-text-secondary text-base mb-6 flex-grow leading-relaxed">${description}</p>

                    <div class="flex items-center text-sm text-text-secondary mb-6 justify-between border-t border-card-bg/50 pt-4">
                        <span class="flex items-center font-medium">
                            <span class="inline-block w-3 h-3 rounded-full mr-2 flex-shrink-0" style="background-color: ${getLanguageColor(language)};"></span>
                            ${language}
                        </span>
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 text-yellow-400" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            ${repo.stargazers_count} stars
                        </span>
                        <span class="text-xs text-text-secondary hidden sm:inline">Updated: ${lastUpdated}</span>
                    </div>

                    <div class="flex flex-col space-y-3 mt-auto">
                        <!-- Primary Action: Start App -->
                        <a href="${liveUrl}" target="_blank" class="block text-center bg-live-site text-white font-bold py-3 rounded-xl hover:bg-opacity-90 transition duration-200 shadow-xl shadow-live-site/30 transform hover:scale-[1.01] active:scale-[0.98] text-base">
                            Start App
                        </a>
                        
                        <!-- Secondary Action: Source Code (Subtle Link) -->
                        <a href="${repo.html_url}" target="_blank" class="block text-center text-text-secondary font-medium py-1 text-sm hover:text-accent-gradient-end transition duration-200">
                            View Source Code on GitHub
                        </a>
                    </div>
                </div>
            `;
        }

        /**
         * Main function to fetch, filter, sort, and display repositories.
         */
        async function fetchRepositories() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    const errorData = await response.json();
                    let message = `Failed to load repositories. Status: ${response.status}.`;
                    if (errorData.message) {
                        message += ` GitHub message: ${errorData.message}`;
                    }
                    showErrorMessage(message);
                    return;
                }

                let repos = await response.json();
                
                // 1. Filter out the specified repository
                repos = repos.filter(repo => repo.name !== REPO_TO_EXCLUDE);

                // 2. Sort alphabetically by repository name
                repos.sort((a, b) => a.name.localeCompare(b.name));

                loadingIndicator.remove(); // Remove loading indicator

                if (repos.length === 0) {
                    repoListElement.innerHTML = `<div class="col-span-full text-center py-16 text-2xl text-text-secondary">No public repositories found (after filtering out '${REPO_TO_EXCLUDE}').</div>`;
                    return;
                }

                // 3. Generate and insert cards
                const repoCardsHtml = repos.map(createRepoCard).join('');
                repoListElement.innerHTML = repoCardsHtml;

            } catch (error) {
                console.error("Network or parsing error:", error);
                showErrorMessage(`A network error occurred while fetching data: ${error.message}`);
            }
        }

        // Initialize fetching when the window loads
        window.onload = fetchRepositories;
    </script>
</body>
</html>
